apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: remove
      image: alpine:3
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      workingDir: $(workspaces.source.path)
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
      script: |
        #!/usr/bin/env sh
        set -eu
        echo "Removing all files from ${WORKSPACE_SOURCE_PATH} ..."
        if [ -d "${WORKSPACE_SOURCE_PATH}" ] ; then
          find "${WORKSPACE_SOURCE_PATH}" -mindepth 1 -delete
        else
          echo "${WORKSPACE_SOURCE_PATH} does not exist."
        fi
        echo "Done"
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: jest-test
spec:
  workspaces:
    - name: source
  params:
    - name: args
      description: Arguments to pass to jest
      type: string
      default: "--verbose"
  steps:
    - name: jest
      image: node:18-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        npm install
        npm test -- $(params.args)
