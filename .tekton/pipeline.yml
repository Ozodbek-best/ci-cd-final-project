---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: eslint
spec:
  workspaces:
    - name: source
  steps:
    - name: eslint
      image: node:18-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/bash
        set -e
        npm install
        npx eslint src tests
