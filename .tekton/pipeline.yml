cat > .tekton/pipeline.yml <<'EOF'
apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: cd-pipeline
spec:
  workspaces:
    - name: pipeline-workspace
  params:
    - name: repo-url
    - name: branch
      default: main
    - name: build-image
  tasks:
    - name: cleanup
      workspaces:
        - name: source
          workspace: pipeline-workspace
      taskRef:
        name: cleanup

    - name: git-clone
      runAfter: [cleanup]
      workspaces:
        - name: output
          workspace: pipeline-workspace
      taskRef:
        name: git-clone
        kind: ClusterTask
      params:
        - name: url
          value: $(params.repo-url)
        - name: revision
          value: $(params.branch)
        - name: deleteExisting
          value: "true"

    - name: eslint
      runAfter: [git-clone]
      workspaces:
        - name: source
          workspace: pipeline-workspace
      taskRef:
        name: eslint

    - name: jest-test
      runAfter: [eslint]
      workspaces:
        - name: source
          workspace: pipeline-workspace
      taskRef:
        name: jest-test

    - name: buildah
      runAfter: [jest-test]
      workspaces:
        - name: source
          workspace: pipeline-workspace
      taskRef:
        name: buildah
        kind: ClusterTask
      params:
        - name: IMAGE
          value: $(params.build-image)
        - name: TLSVERIFY
          value: "false"

    - name: deploy
      runAfter: [buildah]
      taskRef:
        name: openshift-client
        kind: ClusterTask
      params:
        - name: SCRIPT
          value: |
            echo "Deploying $(params.build-image)"
            oc create deployment counter --image=$(params.build-image) --dry-run=client -o yaml | oc apply -f -
            oc rollout status deployment/counter --timeout=120s
            oc get pods -l app=counter
EOF
